name: Pruebas y publicación

# - En pull requests: lint, tipos, pruebas, build y búsqueda de secretos.
# - En la rama main (o a mano): lo mismo y, si todo pasa, publica en GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valores PÚBLICOS: se definen en Settings → Secrets and variables → Actions → Variables.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # Ruta base: /<repositorio>/ en usuario.github.io/<repositorio>; "/" con dominio propio (variable PAGES_BASE).
      VITE_BASE: ${{ vars.PAGES_BASE || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ocr

      - name: Comprobar configuración pública
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::Faltan las variables VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY. La app publicada mostrará la pantalla de configuración."
          fi

      - run: npm run build
      - run: npm run check:secrets

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
