name: Notificaciones push

# Cada hora revisa partidos, kilómetros pendientes y preferencias, y envía los
# recordatorios que tocan. Las claves secretas solo existen aquí (Secrets de
# GitHub), nunca en la web publicada. Si faltan, el trabajo se salta sin fallar.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo mostrar qué se enviaría (no envía nada)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: notifications
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - name: Comprobar configuración
        id: cfg
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ] || [ -z "$VAPID_PUBLIC_KEY" ] || [ -z "$VAPID_PRIVATE_KEY" ] || [ -z "$VAPID_SUBJECT" ]; then
            echo "::notice::Notificaciones sin configurar (faltan variables o secretos). Ver README, sección Notificaciones."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
        if: steps.cfg.outputs.ready == 'true'

      - name: Enviar recordatorios
        if: steps.cfg.outputs.ready == 'true'
        run: npx tsx --tsconfig tsconfig.app.json src/server/notify/run.ts ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
